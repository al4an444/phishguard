<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5b6470; --border: #d9dde3;
    --accent: #2457d6; --low: #1f7a4a; --sus: #a66300; --bad: #c22b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1f25; --text: #e6e9ed; --muted: #9aa3ad; --border: #2c333b;
      --accent: #6d95ff; --low: #4cc38a; --sus: #f0a93b; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; font: inherit; color: inherit;
          background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  button { padding: 12px 20px; font: inherit; font-weight: 600; color: #fff;
           background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  #result { margin-top: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .verdict { font-size: 22px; font-weight: 700; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; margin: 12px 0 16px; overflow: hidden; }
  .bar > div { height: 100%; }
  .low_risk { color: var(--low); } .suspicious { color: var(--sus); } .phishing { color: var(--bad); }
  .fill-low_risk { background: var(--low); } .fill-suspicious { background: var(--sus); } .fill-phishing { background: var(--bad); }
  .domain { color: var(--muted); word-break: break-all; margin-bottom: 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--border); display: flex; gap: 12px; }
  .w { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 36px; }
  .ev { color: var(--muted); font-size: 14px; word-break: break-all; }
  .error { color: var(--bad); }
  footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>PhishGuard</h1>
  <p class="lead">Analiza una URL sospechosa. El análisis es local: la URL nunca se visita.</p>
  <form id="form">
    <input id="url" type="text" placeholder="https://ejemplo.com/login" autocomplete="off" required maxlength="4096">
    <button type="submit">Analizar</button>
  </form>
  <div id="result"></div>
  <footer>API documentada en <a href="/docs">/docs</a></footer>
</main>
<script>
  const LABELS = { low_risk: "Riesgo bajo", suspicious: "Sospechoso", phishing: "Phishing" };
  const result = document.getElementById("result");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;  // never innerHTML: URLs are untrusted input
    return node;
  }

  function render(report) {
    const card = el("div", "card");
    const head = el("div", "head");
    head.append(el("span", "verdict " + report.verdict, LABELS[report.verdict]),
                el("span", "score", report.score + " / 100"));
    const bar = el("div", "bar");
    const fill = el("div", "fill-" + report.verdict);
    fill.style.width = report.score + "%";
    bar.append(fill);
    card.append(head, bar, el("div", "domain", "Dominio registrado: " + report.registered_domain));

    const list = el("ul");
    if (report.findings.length === 0) list.append(el("li", "", "No se detectaron indicadores de phishing."));
    for (const f of report.findings) {
      const item = el("li");
      const body = el("div");
      body.append(el("div", "", f.message));
      if (f.evidence) body.append(el("div", "ev", f.evidence));
      item.append(el("span", "w", "+" + f.weight), body);
      list.append(item);
    }
    card.append(list);
    result.replaceChildren(card);
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const url = document.getElementById("url").value.trim();
    if (!url) return;
    try {
      const response = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await response.json();
      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "URL no válida";
        result.replaceChildren(el("p", "error", detail));
        return;
      }
      render(data);
    } catch (err) {
      result.replaceChildren(el("p", "error", "No se pudo contactar la API."));
    }
  });
</script>
</body>
</html>
