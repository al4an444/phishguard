[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Explainable, offline phishing detection for URLs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tldextract>=5.1",
]
keywords = ["phishing", "security", "url", "typosquatting", "homoglyph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
train = ["scikit-learn>=1.4", "numpy>=1.26", "scipy>=1.11"]
dev = ["fastapi>=0.110", "python-multipart>=0.0.9", "httpx>=0.28.1", "pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["static/*", "model/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
